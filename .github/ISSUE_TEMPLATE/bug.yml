name: Bug
description: Report a reproducible defect in Gian
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private user data, or other secrets.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what happened and the impact.
      placeholder: What failed, and in which situation?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Gian version, branch, or commit SHA.
      placeholder: 0.2.1-hotfix / main@abcdef0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Agent, CLI version, and other relevant configuration.
      placeholder: macOS 15.x, Codex CLI x.y.z
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Write the shortest stable reproduction.
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or other evidence
      description: Remove tokens, personal information, and other sensitive content first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Issues and did not find a duplicate report.
          required: true
        - label: I removed sensitive information from logs and screenshots.
          required: true
