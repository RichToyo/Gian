# Gian-managed DSH profile layer. Applied after @deepseek-ai/dsh-base.
# This bundle must not mount DSH Web, Browser UI, or the headless one-shot runner.
# stdout is reserved for gian.dsh.bridge/1.0 JSON-RPC.

# Match the official Web host plane: model-facing tools belong to each Agent
# preset, not to the process-global base composition.
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webStartup]
      config:
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: gian-dsh-bridge
      name: '@gian/dsh-bridge'
      config:
        stdio: true
